version: "3.9"

# Shared environment injected into all backend services 
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/textlens
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_URL: http://localhost:9000   # browser-reachable URL for presigned links
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: textlens
  # Voyage AI : set this to enable RAG chat (free 200M tokens/month)
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-4-20250514}
  MCP_ENCRYPTION_KEY: ${MCP_ENCRYPTION_KEY:-}
  MCP_KEY_VERSION: ${MCP_KEY_VERSION:-1}
  APPROVAL_TOKEN_TTL_MINUTES: ${APPROVAL_TOKEN_TTL_MINUTES:-15}
  INTERNAL_MCP_SHARED_SECRET: ${INTERNAL_MCP_SHARED_SECRET:-}
  # Implemented locally on the backend service itself (app/api/routes/mcp_google_calendar.py,
  # mcp_email.py) — "backend" here is this compose file's service DNS name, not localhost.
  GOOGLE_CALENDAR_MCP_URL: ${GOOGLE_CALENDAR_MCP_URL:-http://backend:8000/mcp/google-calendar}
  EMAIL_MCP_URL: ${EMAIL_MCP_URL:-http://backend:8000/mcp/email}

services:

  # Infrastructure 
  postgres:
    # pgvector/pgvector:pg16 = official PostgreSQL 16 + pgvector extension pre-installed
    # Required for migration 002 (CREATE EXTENSION vector)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: textlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9100:9000"   # S3 API — used by backend + presigned URL downloads
      - "9101:9001"   # MinIO Console — http://localhost:9101
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Run Alembic migrations then start uvicorn
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4 -Q default,ocr,agents,ingest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-actions:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    command: >
      celery -A app.worker.celery_app worker
      --queues=actions
      --concurrency=4
      --loglevel=info
      --max-tasks-per-child=50
      --time-limit=330
      --soft-time-limit=310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    command: celery -A app.worker.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  minio_data:
